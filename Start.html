<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    :root{
      --bg1: #6a85b6;
      --bg2: #bac8e0;
      --card: #ffffff;
      --accent: #4a76c2;
      --muted: #6b7280;
      --radius: 12px;
    }

    *{box-sizing:border-box}
    html,body{
      height:100%;
      margin:0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      background: linear-gradient(135deg,var(--bg1), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .card{
      width: min(420px, 92%);
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.95));
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 10px 30px rgba(20,30,60,0.18);
      border: 1px solid rgba(255,255,255,0.4);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom: 18px;
    }

    .logo{
      width:48px;
      height:48px;
      border-radius:10px;
      background: linear-gradient(135deg,var(--accent), #7db0ff);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-weight:700;
      font-size:18px;
      box-shadow: 0 6px 18px rgba(74,118,194,0.25);
    }

    h1{
      margin:0;
      font-size:20px;
      color:#0f1724;
    }

    p.lead{
      margin:6px 0 20px 0;
      color:var(--muted);
      font-size:13px;
    }

    form{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    label{
      font-size:13px;
      color:#0f1724;
      margin-bottom:6px;
      display:block;
    }

    .input-group{
      display:flex;
      flex-direction:column;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"]{
      padding:12px 14px;
      border-radius:10px;
      border:1px solid rgba(15,23,36,0.08);
      background: #fff;
      outline:none;
      font-size:14px;
      transition: box-shadow .15s, border-color .15s;
    }

    input:focus{
      box-shadow: 0 6px 18px rgba(74,118,194,0.12);
      border-color: var(--accent);
    }

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .checkbox{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--muted);
      font-size:13px;
    }

    .submit{
      margin-top:6px;
      padding:12px 14px;
      border-radius:10px;
      border:0;
      background: linear-gradient(90deg,var(--accent), #5aa0ff);
      color:white;
      font-weight:600;
      cursor:pointer;
      font-size:15px;
      transition: transform .08s ease, box-shadow .08s;
    }

    .submit:active{ transform: translateY(1px); }
    .links{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:10px;
      font-size:13px;
    }

    a{
      color:var(--accent);
      text-decoration:none;
    }

    a:hover{ text-decoration:underline; }

    .foot{
      text-align:center;
      margin-top:16px;
      font-size:13px;
      color:var(--muted);
    }

    @media (max-width:420px){
      .card{ padding:20px; border-radius:10px; }
      .logo{ width:42px; height:42px; font-size:16px; }
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="login-heading">
    <div class="brand">
      <div class="logo" aria-hidden="true">LP</div>
      <div>
        <h1 id="login-heading">Sign in to your account</h1>
        <p class="lead">Welcome back — please enter your details.</p>
      </div>
    </div>

    <form action="#" method="post" novalidate>
      <div class="input-group">
        <label for="email">Email or username</label>
        <input id="email" name="email" type="text" inputmode="email" autocomplete="username" required placeholder="you@example.com" />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password" />
      </div>

      <div class="row">
        <label class="checkbox">
          <input type="checkbox" name="remember" />
          Remember me
        </label>
        <a href="#" aria-label="Forgot password">Forgot?</a>
      </div>

      <button type="submit" class="submit">Sign in</button>

      <div class="links">
        <span>Don't have an account? <a href="#">Sign up</a></span>
      </div>
    </form>

    <p class="foot">By signing in you agree to the terms of service.</p>
  </main>
</body>
</html>
